<form [formGroup]="form" class="flex flex-col gap-6">
  <div class="flex flex-col gap-2">
    <label for="drift" class="text-sm font-medium text-slate-700">Drift</label>
    <div class="flex items-center gap-4">
      <p-slider
        [unstyled]="true"
        [pt]="sliderPt"
        formControlName="drift"
        [min]="-1"
        [max]="1"
        [step]="0.01"
        class="flex-1"
      />
      <p-inputNumber
        [unstyled]="true"
        [pt]="inputNumberPt"
        formControlName="drift"
        inputId="drift"
        [min]="-1"
        [max]="1"
        [step]="0.01"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
      />
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <label for="volatility" class="text-sm font-medium text-slate-700">Volatility</label>
    <div class="flex items-center gap-4">
      <p-slider
        [unstyled]="true"
        [pt]="sliderPt"
        formControlName="volatility"
        [min]="0"
        [max]="2"
        [step]="0.01"
        class="flex-1"
      />
      <p-inputNumber
        [unstyled]="true"
        [pt]="inputNumberPt"
        formControlName="volatility"
        inputId="volatility"
        [min]="0"
        [max]="2"
        [step]="0.01"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
      />
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <label for="steps" class="text-sm font-medium text-slate-700">Steps</label>
    <div class="flex items-center gap-4">
      <p-slider
        [unstyled]="true"
        [pt]="sliderPt"
        formControlName="steps"
        [min]="1"
        [max]="10000"
        [step]="1"
        class="flex-1"
      />
      <p-inputNumber
        [unstyled]="true"
        [pt]="inputNumberPt"
        formControlName="steps"
        inputId="steps"
        [min]="1"
        [max]="10000"
        [step]="1"
      />
    </div>
  </div>
</form>
