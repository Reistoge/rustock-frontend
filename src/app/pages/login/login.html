<main class="flex min-h-screen items-center justify-center px-4 py-12">
  <div class="flex w-full max-w-[420px] flex-col gap-6 rounded-2xl border border-line bg-white p-10">
    <div class="flex flex-col gap-1.5">
      <span class="text-lg font-bold tracking-tight">Rustock</span>
      <h1 class="m-0 text-[28px] font-semibold tracking-tight">Iniciar sesión</h1>
      <p class="m-0 text-sm text-muted">Ingresa para ver tus acciones y simulaciones.</p>
    </div>

    @if (registered()) {
      <p-message severity="success" text="Cuenta creada. Ya puedes iniciar sesión." />
    }

    <form class="flex flex-col gap-3.5" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-sm font-medium">Correo</label>
        <input
          pInputText
          id="email"
          type="email"
          autocomplete="email"
          placeholder="nombre@correo.com"
          formControlName="email"
          [class.is-invalid]="showError('email')"
          [attr.aria-invalid]="showError('email')"
          [attr.aria-describedby]="showError('email') ? 'email-error' : null"
        />
        @if (showError('email')) {
          <p id="email-error" class="m-0 text-[13px] text-danger">Ingresa un correo válido.</p>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-sm font-medium">Contraseña</label>
        <p-password
          inputId="password"
          formControlName="password"
          autocomplete="current-password"
          [feedback]="false"
          [class.is-invalid]="showError('password')"
        />
        @if (showError('password')) {
          <p class="m-0 text-[13px] text-danger">Ingresa tu contraseña.</p>
        }
      </div>

      @if (submitError(); as error) {
        <p class="m-0 text-sm text-danger" role="alert">{{ error }}</p>
      }

      <p-button
        type="submit"
        styleClass="mt-2 w-full"
        [label]="submitting() ? 'Ingresando…' : 'Iniciar sesión'"
        [loading]="submitting()"
      />
    </form>

    <p class="m-0 text-center text-sm text-muted">
      ¿No tienes cuenta?
      <a routerLink="/register" class="font-medium">Regístrate</a>
    </p>
  </div>
</main>
