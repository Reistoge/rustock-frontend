<main class="flex min-h-screen flex-col gap-6 bg-slate-50 p-6">
  <h1 class="text-2xl font-semibold text-slate-900">Simulation Workbench</h1>

  <div class="flex flex-col gap-6 lg:flex-row">
    <aside class="w-full shrink-0 rounded-xl border border-slate-200 bg-white p-6 shadow-sm lg:w-80">
      <app-parameter-panel (parametersChange)="onParametersChange($event)" />
    </aside>

    <section class="flex-1 overflow-x-auto rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <app-uplot-chart [options]="chartOptions" [data]="chartData()" />
    </section>
  </div>
</main>
