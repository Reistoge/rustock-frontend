<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closeOnEscape]="true"
  appendTo="body"
  [pt]="{ root: { 'aria-labelledby': 'stock-dialog-title' } }"
  (onShow)="onShow()"
>
  <ng-template #header>
    <h2 id="stock-dialog-title" class="m-0 text-xl font-semibold">{{ title() }}</h2>
    <p class="m-0 text-sm text-muted">{{ body() }}</p>
  </ng-template>

  <form class="flex flex-col gap-[18px]" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (isAdd()) {
      <div class="flex flex-col gap-1.5">
        <label for="stock-ticker" class="text-sm font-medium">Ticker</label>
        <input
          pInputText
          id="stock-ticker"
          formControlName="ticker"
          placeholder="AAPL"
          maxlength="10"
          class="font-mono uppercase"
          [class.is-invalid]="invalid('ticker')"
          [attr.aria-invalid]="invalid('ticker')"
        />
      </div>
    }

    <div class="flex flex-col gap-1.5">
      <label for="stock-name" class="text-sm font-medium">Nombre</label>
      <input
        pInputText
        id="stock-name"
        formControlName="name"
        placeholder="Apple Inc."
        maxlength="100"
        [class.is-invalid]="invalid('name')"
        [attr.aria-invalid]="invalid('name')"
      />
    </div>


    @if (error(); as message) {
      <p class="m-0 text-[13px] text-danger" role="alert">{{ message }}</p>
    }

    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" severity="secondary" (onClick)="close()" />
      <p-button
        type="submit"
        [label]="isAdd() ? 'Agregar' : 'Guardar'"
        [loading]="saving()"
        [disabled]="form.invalid"
      />
    </div>
  </form>
</p-dialog>
